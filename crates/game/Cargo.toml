[package]
name = "game"
description = "Sunscatter v0.2 prototype: Bevy app (rendering, input, UI) over the sim crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Faster incremental builds while iterating: `cargo run -p game --features dev`.
# Never use for release/distribution builds.
dev = ["bevy/dynamic_linking"]

[dependencies]
sim = { path = "../sim" }
mcp = { path = "../mcp" }
serde_json = "1"
# `trace`: per-system spans, read by the profiler (`game::profile`,
# SUNSCATTER_PROFILE=1); filtered out at the source otherwise.
bevy = { version = "0.19.1", features = ["trace"] }
bevy_egui = "0.42"
# Timestamp queries for the profiler's GPU times (the version Bevy uses).
wgpu = { version = "29.0.3", default-features = false }
glam.workspace = true
serde.workspace = true
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
directories = "6.0.0"

[dev-dependencies]
# Composing and validating the shaders as Bevy does (`shader_tests`).
naga_oil = "0.22"
naga = { version = "29", features = ["wgsl-in", "msl-out"] }

[lints]
workspace = true
