[package]
name = "game"
description = "Sunscatter v0.2 prototype: Bevy app (rendering, input, UI) over the sim crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Faster incremental builds while iterating: `cargo run -p game --features dev`.
# Never use for release/distribution builds.
dev = ["bevy/dynamic_linking"]

[dependencies]
sim = { path = "../sim" }
bevy = "0.19.1"
bevy_egui = "0.42"
glam.workspace = true
serde.workspace = true
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
directories = "6.0.0"

[lints]
workspace = true
