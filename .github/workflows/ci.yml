name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: everything except Bevy. Only `-p sim -p ephem-tool -p asset-tool -p mcp`
  # (never `--workspace`, which would build Bevy for clippy).
  sim:
    name: sim (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim
      - name: Format
        run: cargo fmt --all --check
      - name: File size limit
        shell: bash
        run: tools/check_file_sizes.sh
      - name: Decision references
        shell: bash
        run: tools/check_decision_refs.sh
      - name: Clippy (sim, ephem-tool, asset-tool, mcp)
        run: cargo clippy -p sim -p ephem-tool -p asset-tool -p mcp --all-targets --locked -- -D warnings
      - name: Tests (sim, asset-tool, mcp)
        run: cargo test -p sim -p asset-tool -p mcp --locked

  # The Bevy app. Slow when the cache is cold; runs in parallel with `sim`.
  game:
    name: game (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game
      - name: Clippy (game)
        run: cargo clippy -p game --all-targets --locked -- -D warnings
      - name: Tests (game)
        run: cargo test -p game --locked
      - name: Build game
        run: cargo build -p game --locked
